[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phage-kmer-language-model"
version = "0.1.0"
description = "Autoregressive k-mer Transformer baseline for bacteriophage DNA sequence modeling"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
